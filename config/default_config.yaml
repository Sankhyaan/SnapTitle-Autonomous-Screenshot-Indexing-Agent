# SnapTitle Configuration

# Folder to watch for screenshots (leave blank "" to auto-detect OS default screenshot directory)
screenshots_dir: ""

# Enable non-blocking on-screen popup notification
show_popup: true

# Non-blocking popup display duration before auto-saving (seconds)
popup_duration_seconds: 5

# AI Provider: "gemini" (Cloud Multimodal - Fast & Accurate) or "ollama" (Local Models)
ai_provider: "gemini"

# Google Gemini API Settings (Multimodal Vision & High-Accuracy Titling)
gemini_api_key: ""
gemini_model: "gemini-3.7-flash"

# Local AI Models (Ollama Fallback)
llm_model: "llama3.2:3b"
vlm_model: "moondream:latest"
ollama_host: "http://127.0.0.1:11434"

# Tesseract executable path (leave blank "" to auto-detect in PATH or standard installation directories)
tesseract_cmd: ""

# Database storage path for historical title logs and indexing
database_path: "data/snaptitle.db"
